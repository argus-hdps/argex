[project]
name = "argus-explorer-client"
version = "0.3.0"
description = "Python client for the Argus data explorer tile server"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "numpy>=1.26",
    "astropy>=6.0",
]

[dependency-groups]
dev = [
    "pytest>=8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/argex"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["live: needs a running explorer server (set EXPLORER_URL)"]
