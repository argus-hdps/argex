[project]
name = "argex"
version = "0.4.0"
description = "Python client for the Argus data explorer tile server"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    {name = "Hank Corbett", email = "htc@unc.edu"},
]
requires-python = ">=3.11"
classifiers = [
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Astronomy",
]
dependencies = [
    "httpx>=0.27",
    "numpy>=1.26",
    "astropy>=6.0",
]

[project.urls]
Repository = "https://github.com/argus-hdps/argex"

[dependency-groups]
dev = [
    "pytest>=8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/argex"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["live: needs a running explorer server (set EXPLORER_URL)"]
